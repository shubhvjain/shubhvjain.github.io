---
layout: default
---

<div class="container mt-5">
  <h1 class="mb-4">Tag: {{ page.title }}</h1>

  <!-- <div class="list-group"> -->
    {% for post in page.posts %}
    

       <div class="d-flex justify-content-between align-items-center py-2 border-bottom1">
        <a href="{{ post.url }}" class="text-decoration-none">{{ post.title }}</a>
        <small class="text-muted">{{ post.date | date: "%d-%m-%Y" }}</small>
      </div>


    {% endfor %}
  <!-- </div> -->
</div>
