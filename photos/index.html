<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SVJ on the web : Photo gallery </title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Vue.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        padding-top: 4rem; /* space for fixed navbar */
        background-color: #121212;
        color: #ccc;
      }

      /* Gallery masonry columns */
      .gallery {
        column-count: 3;
        column-gap: 1rem;
      }

      .photo-card {
        break-inside: avoid;
        margin-bottom: 1rem;
        width: 100%;
        display: inline-block;
        padding: 0.5rem;
        border-radius: 0.5rem;
        /* Default dark card bg */
        background-color: transparent;
      }

      .photo-card img {
        width: 100%;
        height: auto;
        border-radius: 8px;
        display: block;
      }

      @media (max-width: 992px) {
        .gallery {
          column-count: 2;
        }
      }

      @media (max-width: 576px) {
        .gallery {
          column-count: 1;
        }
      }

      /* Basic layout (default) */
      .photo-card.basic {
        background-color: transparent;
        color: #ccc;
      }

      /* Polaroid style */
      .photo-card.polaroid img {
        border-radius: 0;
        margin-bottom: 10px;
        border: 1px solid #ddd;
        display: block;
      }

      .photo-card.polaroid {
        background: white;
        padding: 10px 10px 20px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        border-radius: 4px;
        text-align: center;
        display: inline-block;
        position: relative;
        color: #333; /* dark text on white background */
      }

      /* Slight random rotations for polaroid */
      .polaroid.rotate-1 {
        transform: rotate(-3deg);
      }
      .polaroid.rotate-2 {
        transform: rotate(-2deg);
      }
      .polaroid.rotate-3 {
        transform: rotate(3deg);
      }
      .polaroid.rotate-4 {
        transform: rotate(-1deg);
      }
      .polaroid.rotate-5 {
        transform: rotate(2deg);
      }

      /* Captions */
         /* Captions */
      .caption {
        font-size: 1.1rem; /* a bit bigger */
        color: #ccc;
      }
      .caption .location-time {
        font-size: 0.8rem; /* smaller */
        color: #999;
      }
      .photo-card.polaroid .caption {
        font-family: 'Courier New', Courier, monospace;
        font-size: 1.5rem;
        text-align: center;
        color: #333;
      }
      .photo-card.polaroid .caption .location-time {
        font-size: 0.85rem;
        color: #666;
      }

      /* Navbar adjustments */
      body {
        padding-top: 4rem;
      }
      .navbar {
        position: fixed;
        top: 0;
        width: 100%;
        z-index: 1030;
      }

      /* Dropdown in navbar */
      select.form-select {
        background-color: #222 !important;
        color: #eee !important;
        border-color: #444 !important;
      }
    </style>
  </head>
  <body>
   

    <div id="app" class="container-fluid py-4">
      <nav class="navbar navbar-dark bg-dark px-3">
        <div class="container-fluid">
          <div class="d-flex flex-column flex-md-row justify-content-between w-100">
            <div class="d-flex align-items-center">
              <a href="/" class="text-decoration-none text-light fw-bold">~</a>
              <span class="mx-2 text-light">/</span>
              <span class="text-light fw-bold">photos</span>
              <span v-if="about" class="text-muted ms-2 small">: {{ about }}</span>
            </div>
  
            <div class="d-flex align-items-center mt-2 mt-md-0">
              <label class="text-light me-2 mb-0" for="filterSelect">Filter:</label>
              <select
                id="filterSelect"
                v-model="selectedFilter"
                @change="applyFilter"
                class="form-select form-select-sm bg-dark text-light border-light"
              >
                <option value="">- None -</option>
                <optgroup label="Time" class="group-label">
                  <option
                    v-for="time in filters.time"
                    :key="'time-'+time"
                    :value="'time:' + time"
                  >
                    {{ time }}
                  </option>
                </optgroup>
                <optgroup label="Location" class="group-label">
                  <option
                    v-for="loc in filters.location"
                    :key="'loc-'+loc"
                    :value="'location:' + loc"
                  >
                    {{ loc }}
                  </option>
                </optgroup>
                <optgroup label="Tags" class="group-label">
                  <option
                    v-for="tag in filters.tags"
                    :key="'tag-'+tag"
                    :value="'tag:' + tag"
                  >
                    {{ tag }}
                  </option>
                </optgroup>
              </select>
            </div>
          </div>
        </div>
      </nav>
     
  
            <!-- <div class="d-flex align-items-center mt-2 mt-md-0">
              <label class="text-light me-2 mb-0">Style:</label>
              <select
                v-model="styleMode"
                class="form-select form-select-sm bg-dark text-light border-light"
              >
                <option value="basic">Basic</option>
                <option value="polaroid">Polaroid</option>
              </select>
            </div> -->
         
      <div class="gallery">
        <div
          :class="['photo-card', styleMode, 'rotate-' + (index % 5 + 1)]"
          v-for="(photo, index) in visiblePhotos"
          :key="index"
        >
          <img :src="photo.url" :alt="photo.caption || 'Photo'" loading="lazy" />
          <div class="caption">
            {{ photo.caption }}
            <div>
              <span class="location-time">
                <span v-if="photo.location">{{ photo.location }} - </span
                >{{ formatDate(photo.time) }}
              </span>
            </div>
            
          </div>
        </div>
      </div>

      <footer class="bg-dark text-light text-center py-3 mt-auto" id="footer">
      </footer>
      
      <script>
        const year = new Date().getFullYear();
        document.getElementById('footer').innerHTML = `&copy; ${year} copyright SVJ`;
      </script>
    </div>

    <script>
      const { createApp } = Vue;

createApp({
  data() {
    return {
      about: '',
      allPhotos: [],
      filteredPhotos: [],
      visiblePhotos: [],
      perPage: 25,
      currentPage: 0,
      loading: false,
      styleMode: 'polaroid',
      filters: {
        time: [],
        location: [],
        tags: [],
      },
      selectedFilter: '',
    };
  },
  computed: {
    hasMore() {
      return this.visiblePhotos.length < this.filteredPhotos.length;
    },
  },
  methods: {
    loadMorePhotos() {
      if (this.loading || !this.hasMore) return;
      this.loading = true;
      const start = this.currentPage * this.perPage;
      const end = start + this.perPage;
      this.visiblePhotos.push(...this.filteredPhotos.slice(start, end));
      this.currentPage++;
      this.loading = false;
    },
    onScroll() {
      const scrollPos = window.scrollY + window.innerHeight;
      const bottom = document.body.offsetHeight - 300;
      if (scrollPos >= bottom) {
        this.loadMorePhotos();
      }
    },
    formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleString('default', { month: 'short', year: 'numeric' });
    },
    applyFilter() {
      if (!this.selectedFilter) {
        // no filter, show all
        this.filteredPhotos = this.allPhotos;
      } else {
        const [type, value] = this.selectedFilter.split(':');
        if (type === 'time') {
          // filter by month/year string
          this.filteredPhotos = this.allPhotos.filter((photo) => {
            const photoTime = this.formatDate(photo.time);
            return photoTime === value;
          });
        } else if (type === 'location') {
          this.filteredPhotos = this.allPhotos.filter(
            (photo) => photo.location === value
          );
        } else if (type === 'tag') {
          this.filteredPhotos = this.allPhotos.filter(
            (photo) => photo.tags && photo.tags.includes(value)
          );
        } else {
          this.filteredPhotos = this.allPhotos;
        }
      }
      this.currentPage = 0;
      this.visiblePhotos = [];
      this.loadMorePhotos();
    },
    extractFilters() {
      const timeSet = new Set();
      const locationSet = new Set();
      const tagSet = new Set();

      this.allPhotos.forEach((photo) => {
        // time as 'MMM yyyy' (short month + year)
        const date = new Date(photo.time);
        const timeStr = date.toLocaleString('default', { month: 'short', year: 'numeric' });
        timeSet.add(timeStr);

        if (photo.location) {
          locationSet.add(photo.location);
        }

        if (photo.tags && photo.tags.length) {
          photo.tags.forEach((tag) => tagSet.add(tag));
        }
      });

      this.filters.time = Array.from(timeSet).sort((a, b) => {
        // Sort descending by date
        return new Date(b) - new Date(a);
      });
      this.filters.location = Array.from(locationSet).sort();
      this.filters.tags = Array.from(tagSet).sort();
    },
  },
  mounted() {
    fetch('./data.json')
      .then((res) => res.json())
      .then((data) => {
        this.about = data.photos.about;
        this.allPhotos = data.photos.list.sort(
          (a, b) => new Date(b.time) - new Date(a.time)
        );
        this.extractFilters();
        this.filteredPhotos = this.allPhotos;
        this.loadMorePhotos();
        window.addEventListener('scroll', this.onScroll);
      });
  },
  beforeUnmount() {
    window.removeEventListener('scroll', this.onScroll);
  },
}).mount('#app');
    </script>
  </body>
</html>
